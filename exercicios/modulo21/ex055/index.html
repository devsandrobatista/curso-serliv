<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>

    <style>
      @keyframes anda {
        from {
          transform: translateX(0);
          background: #ff0;
        }
        50% {
          background:  #0f0;
        }

        to {
          transform: translateX(300px);
          background: #00f;
        }
      }

      @keyframes height {
        0% {height: 80px;}
        100% {height: 120px;}
      }
      @keyframes width {
        0% {width: 100px;}
        100% {width: 400px;}
        
      }

      .anima {
        width: 400px;
        outline: 3px solid #f00;

        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .anima__child {
        width: 100px;
        height: 50px;
        background: #ccc;

        display: flex;
        align-items: center;
        justify-content: center;

        counter-increment: contador;
        /* animation: name duration timing-function delay iteration-count direction fill-mode; */
        animation-name: anda;
        animation-duration: 2s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        animation-direction: alternate;

        &::before {
          content: "0" counter(contador);
        }
      }

      .anima__child:nth-child(2) {
        animation-delay: 2s;
        animation-iteration-count: 3;
        animation-fill-mode: both;
      }
      .anima__child:nth-child(3) {
        animation: anda 2s ease-in-out infinite alternate,
        height 2s linear 5 alternate;
      }

      .anima__child:nth-child(n+4):nth-child(-n+7) {
        animation-name: width;
        &::before {
          content: "";
        }
      }

      .anima__child:nth-child(4) {
        animation-timing-function: steps(5, jump-start);
      }
      .anima__child:nth-child(5) {
        animation-timing-function: steps(5, jump-end);
      }
      .anima__child:nth-child(6) {
        animation-timing-function: steps(5, jump-both);
      }
      .anima__child:nth-child(7) {
        animation-timing-function: steps(5, jump-none);
      }
    </style>
  </head>
  <body>
    <h1>Animation</h1>
    <div class="anima" id="anima">
      <div class="anima__child"></div>
      <div class="anima__child"></div>
      <div class="anima__child"></div>
      <div class="anima__child"><code>jump-start</code></div>
      <div class="anima__child"><code>jump-end</code><small>(default)</small></div>
      <div class="anima__child"><code>jump-both</code></div>
      <div class="anima__child"><code>jump-none</code></div>
      <div class="anima__child"></div>
  </body>
</html>
