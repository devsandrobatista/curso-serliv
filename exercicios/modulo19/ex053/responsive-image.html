<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Images Responsivas</title>

    <style>
      img {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <img
      src="assets/images/1280.jpg"
      alt="Texto alternativo"
      srcset="
        assets/images/960.jpg 960w,
        assets/images/640.jpg 640w,
        assets/images/480.jpg 480w
      "
      sizes="(min-width: 900px) 33vw, (min-width: 600px) 50vw, 100vw"
    />
    <hr />
    <picture>
      <source
        media="(min-width: 900px)"
        srcset="
          assets/images/1280.jpg 1280w,
          assets/images/960.jpg   960w,
          assets/images/640.jpg   640w
        "
        sizes="33vw"
        ;
      />
      <source
        media="(min-width: 600px)"
        srcset="
          assets/images/1280.jpg 1280w,
          assets/images/960.jpg   960w,
          assets/images/640.jpg   640w
        "
        sizes="50vw"
      />
      <img src="assets/images/1280.jpg" alt="Texto alternativo" />
    </picture>
  </body>
</html>
