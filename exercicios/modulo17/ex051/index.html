<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Viewport</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        font-size: 62.5%;
      }

      .section {
        height: 100dvh;
        padding: 1rem;

        &:nth-child(odd) {
          background: blueviolet;
        }
        &:nth-child(even) {
          background: brown;
        }
      }

      .section__title {
        color: #fff;
        font-size: 3rem;
      }

      @media (max-width: 401.7px) {
        main::after {
          color: #fff;
          content: "olá";
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="section">
        <div class="section__content-box">
          <h2 class="section__title">Testando novas unidades de medidas</h2>
        </div>
      </section>
      <section class="section">
        <div class="section__content-box">
          <h2 class="section__title">Testando novas unidades de medidas</h2>
        </div>
      </section>
    </main>
  </body>
</html>
