<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Query Laboratório</title>

    <link rel="stylesheet" href="assets/css/reset.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap");

      :root {
        --background-card: #e3f2fd;
        --title-color: #0d47a1;
        --text-color: #1565c0;
        --button-color: #42a5f5;

        --box-shadowColor: rgb(0, 0, 0, 0.23);

        --font-title: "Nunito", sans-serif;
        --font-text: "Raleway", sans-serif;
      }

      body {
        background: #f5f5f5;
      }

      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: var(--background-card);
        max-width: 43rem;
        min-height: 40vh;
        padding: 2.4rem;
        border: 2px solid #000;
        border-radius: 2rem;
        box-shadow: 0 6px 6px rgb(0, 0, 0, 0.23);

        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 0.8rem;

        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .card__title {
        margin-bottom: 1.6rem;

        color: var(--title-color);
        font-family: var(--font-title);
        text-transform: capitalize;
      }

      .card__text {
        color: var(--text-color);
        font-family: var(--font-text);
        line-height: 1.4;
      }

      .btn {
        display: block;
        width: fit-content;
        background: var(--button-color);
        padding: 1.2rem 2.4rem;
        border-radius: 0.75rem;
        margin-inline: auto;

        color: var(--background-card);
        font-weight: 600;
        text-decoration: none;
        text-shadow: 1px 1px 0 var(--title-color);

        transition: background 0.3s linear;
      }

      @media (hover: hover) and (pointer: fine) {
        .card:hover {
          transform: scale(1.03);
          box-shadow: 0 8px 8px var(--box-shadowColor);
        }

        .btn:hover {
          background: var(--text-color);
        }
        .btn:active {
          background: var(--button-color);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
        .card:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="container">
        <article class="card">
          <div class="card__content">
            <h1 class="card__title">Aprenda algo novo hoje</h1>
            <p class="card__text">
              Descubra dicas rápidas e práticas que podem transformar sua
              rotina. Cada dia é uma oportunidade para evoluir e se inspirar.
            </p>
          </div>
          <div class="card__cta">
            <a href="#" class="btn">Explorar Agora</a>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
