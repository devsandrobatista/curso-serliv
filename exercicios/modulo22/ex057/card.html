<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card 3D</title>

    <style>
      body {
        font-family: sans-serif;
      }

      /* G E R A L */
      .container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      }
      .cena {
        width: 300px;
        height: 400px;
        border: 2px solid #ccc;
        margin: 60px;
        perspective: 600px;
        position: relative;

        & input[type="checkbox"] {
          position: absolute;
          top: 0;
          left: 0;
          z-index: 999;
          cursor: pointer;
        }
      }
      .cena:has(input[type="checkbox"]:checked) .card {
        transform: rotateY(180deg);
      }
      .card {
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 1s;
        position: relative;
      }
      .card__face {
        width: 100%;
        height: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        backface-visibility: hidden;
        position: absolute;
      }
      .card__face--front {
        background: #b9eaf9;
      }
      .card__face--back {
        background: #0e2e34;
        color: #b9eaf9;
        transform: rotateY(180deg);
      }

      .cena2 {
        & .card {
          transform-origin: right center;
        }
      }
      .cena3 {
        & .card {
          transform-origin: right center;
        }

        & .card__face--back {
          transform: translate(100%) rotateY(180deg);
        }
      }
      .cena4 {
        & .card {
          transform-origin: right center;
        }

        &:has(input[type="checkbox"]:checked) .card {
          transform: translateX(-300px) rotateY(-180deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="cena cena1">
        <input type="checkbox" />
        <div class="card">
          <div class="card__face card__face--front">Front</div>
          <div class="card__face card__face--back">Back</div>
        </div>
      </div>
      <div class="cena cena2">
        <input type="checkbox" />
        <div class="card">
          <div class="card__face card__face--front">Front</div>
          <div class="card__face card__face--back">Back</div>
        </div>
      </div>
      <div class="cena cena3">
        <input type="checkbox" />
        <div class="card">
          <div class="card__face card__face--front">Front</div>
          <div class="card__face card__face--back">Back</div>
        </div>
      </div>
      <div class="cena cena4">
        <input type="checkbox" />
        <div class="card">
          <div class="card__face card__face--front">Front</div>
          <div class="card__face card__face--back">Back</div>
        </div>
      </div>
    </div>
  </body>
</html>
