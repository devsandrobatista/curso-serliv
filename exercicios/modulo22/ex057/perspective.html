<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transformações 3D</title>

    <style>
      * {
        box-sizing: border-box;
      }

      .cena {
        width: 300px;
        border: 2px solid #ccc;
        aspect-ratio: 1;
        margin: 10vh auto;
      }

      .plano {
        background: #f00;
      }

      #cena1 {
        background: #000;
        perspective: 600px;
      }

      #cena1 .plano {
        width: 200px;
        margin: 50px;
        aspect-ratio: 1;
        transform: rotateY(45deg);
      }

      #cena2 {
        background: #000;
      }

      #cena2 .plano {
        width: 200px;
        margin: 50px;
        aspect-ratio: 1;
        transform: perspective(600px) rotateY(45deg);
      }

      #cena3, #cena4, #cena5 {
        display: grid;
        padding: 1rem;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }

      #cena3 {
        perspective: 600px;
        /* perspective-origin: center bottom; */
      }

      #cena3 .plano {
        transform: rotateY(45deg);
      }

      #cena5 .plano {
        transform: perspective(600px) rotateX(45deg);
        backface-visibility: hidden;
      }
    </style>
  </head>
  <body>
    <h1>Transformações 3D</h1>
    <div class="container">
      <div class="cena" id="cena1">
        <div class="plano"></div>
      </div>
      <div class="cena" id="cena2">
        <div class="plano"></div>
      </div>
    </div>
      <div class="cena" id="cena3">
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
      </div>
      <div class="cena" id="cena4">
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
      </div>
    </div>
      <div class="cena" id="cena5">
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
        <div class="plano"></div>
      </div>
    </div>
  </body>
</html>
