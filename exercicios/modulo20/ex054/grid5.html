<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      .gridContainer {
        width: 90%;
        padding: 1em;
        background: #ccc;
      }

      .gridItem {
        background-color: orange;
        padding: 15px;
        font-family: sans-serif;
      }

      /* GRID */
      .gridContainer {
        display: grid;
        grid-template-rows: repeat(3, 100px);
        grid-auto-flow: column;
        grid-auto-columns: 50px 100px;
        gap: 10px;
      }
    </style>
  </head>

  <body>
    <div class="gridContainer">
      <div class="gridItem">1</div>
      <div class="gridItem">2</div>
      <div class="gridItem">3</div>
      <div class="gridItem">4</div>
      <div class="gridItem">5</div>
      <div class="gridItem">6</div>
      <div class="gridItem">7</div>
      <div class="gridItem">8</div>
    </div>
  </body>
</html>
