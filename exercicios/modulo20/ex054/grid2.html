<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      .gridContainer {
        width: 100vw;
        height: 100vh;
        padding: 1em;
        background: #ccc;
      }

      .gridItem {
        background-color: orange;
        padding: 15px;
        font-family: sans-serif;
      }

      /* GRID */
      .gridContainer {
        display: grid;
        /* grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 75px 50px 1fr 50px; */
        gap: 1em;

        /* grid-template-areas:
          "header header header"
          "nav nav aside"
          "main main aside"
          "footer footer footer"; */

        grid-template:
          "header header header" 75px
          "nav nav ." 50px
          "main main aside" 1fr
          "footer footer ." 50px
          / 1fr 1fr 1fr;
      }

      .header {
        background: #c6edff;
        /* grid-column: 1 / -1; */
        /* grid-area: header; */
        grid-column: header-start / header-end;
      }
      .nav {
        background: #ffcfd5;
        /* grid-column: span 2; */
        grid-area: nav;
      }
      .aside {
        background: #fef2b5;
        /* grid-row: 2 / -1; */
        /* grid-column: 3; */
        grid-area: aside;
      }
      .main {
        background: #e0d1ed;
        /* grid-column: span 2; */
        grid-area: main;
      }
      .footer {
        background: #b1ffd7;
        /* grid-row: 4; */
        /* grid-column: 1 / -1; */
        grid-area: footer;
      }
    </style>
  </head>

  <body>
    <div class="gridContainer">
      <header class="header gridItem">header</header>
      <nav class="nav gridItem">nav</nav>
      <aside class="aside gridItem">aside</aside>
      <main class="main gridItem">main</main>
      <footer class="footer gridItem">footer</footer>
    </div>
  </body>
</html>
