<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Online</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main class="container">
      <div class="wrapper">
        <div class="calculator">
          <div class="calculator__display">
            <div class="calculator__value">0</div>
          </div>
          <button class="calculator__btn calculator__btn--symbol">
            &#140;
          </button>
          <button
            class="calculator__btn calculator__btn--symbol calculator__btn--percentage"
          >
            &#37;
          </button>
          <button
            class="calculator__btn calculator__btn--symbol calculator__btn--multiplication"
          >
            &#42;
          </button>
          <button
            class="calculator__btn calculator__btn--symbol calculator__btn--division"
          >
            &#47;
          </button>
          <button
            class="calculator__btn calculator__btn--symbol calculator__btn--equal"
          >
            &#61;
          </button>
          <button
            class="calculator__btn calculator__btn--symbol calculator__btn--subtraction"
          >
            &#45;
          </button>
          <button
            class="calculator__btn calculator__btn--symbol calculator__btn--addition"
          >
            &#43;
          </button>
          <button
            class="calculator__btn calculator__btn--symbol calculator__btn--comma"
          >
            &#44;
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--one"
          >
            1
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--two"
          >
            2
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--three"
          >
            3
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--four"
          >
            4
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--five"
          >
            5
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--six"
          >
            6
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--seven"
          >
            7
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--eight"
          >
            8
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--nine"
          >
            9
          </button>
          <button
            class="calculator__btn calculator__btn--number calculator__btn--zero"
          >
            0
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
